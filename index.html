22651 RIR) \u2014 Brian, Sep 23; dips/pull-ups \u22652 RIR (C07/C08)."},{id:"E5",rule:"Two easy days before each test session",exception:"Week-12 Wednesday (OHP test, no dip/pull-up work) counts as an easy day for Friday\u2019s dip and pull-up tests."},{id:"E6",rule:"Saturday rest",exception:"Saturday, Dec 26 week-13 makeup, deferred tests only."},{id:"E7",rule:"Full priority rest (v3.0)",exception:"Brian, Sep 23: priority rests 2:00\u20133:00, squat/deadlift 2:30\u20133:00."},{id:"E8",rule:"Friday impact 15-minute cap (v3.0)",exception:"Brian, Sep 23: Friday ~30 min target, not a hard limit; travel not budgeted. Wednesday stays \u226415 min."},{id:"E9",rule:"Exercise exclusions (v3.0)",exception:"Brian, Sep 23: dumbbell row and cable row allowed."},{id:"E10",rule:"Pull-up work every Wednesday",exception:"Week 12 Wednesday has no pull-ups so Friday\u2019s test is fresh; the OHP test is the day\u2019s major lift."},{id:"E11",rule:"Explicit power every lifting day",exception:"Week-12 Friday has no power work and no KB complex: nothing goes in front of the dip and pull-up tests (amendment A3; Brian, Sep 24)."}]};var Cf=["Fresh dip priority, paused bench, one-arm chest-supported rows; biceps for size. Starts \u22656 h after the long ride ends.","Cut order: (1) power sets 3\u20134, (2) 3rd biceps set, then (3) the 3rd bench set (press stays \u226516). Never cut: dip work, row sets, both core sets, cable ER, the carry. No exercise is ever done for just 1 set.","Sunday checks: power follows the long ride \u2014 if the push-ups/chest passes lose pop, use the hands-elevated regression and stop at 2 sets. Dips are the fresh priority; nothing tiring comes before them.","Preparation only: no work-set or accessory credit. Wall slides live here and nowhere else.","Thoracic rotations \u2014 6/side","Scapular depressions \u2014 5 \xD7 3 s","Incline push-up rehearsal \u2014 5 smooth reps","One easy rehearsal set of 2, 30 s, then work sets with 60 s between; 45 s before the dip ramps.","Each rest follows that ramp, including the last rest before the first work set. Ramps never count as work sets.","Dip work (fresh priority)","Full rest between every work set (2:00\u20133:00 upper, 2:30\u20133:00 lower). No accessory work during priority rests.","One light ramp of 6/side, 45 s, then work. 75 s after each left+right pair.","Biceps + shoulder health (superset)","Round = curl set, shoulder set; repeat. The third curl set follows the second shoulder set. No extra rest needed: each exercise rests while its partner works (\u226560 s).","Unallocated time for crowded equipment, longer priority rests (up to 3:00) or logging. Never filled with extra sets.","Plyometric push-up (hands leave the floor)","Bodyweight. Hands leave the floor by a few inches; land softly and rebound straight into the next rep.","Upper-body pushing speed for dips and bench; no leg demand after the long ride","Hands-elevated plyometric push-up on a bench, same sets and reps.","After two crisp exposures: more flight height, then a clap, then a light vest (+5\u201310 lb) \u2014 one change at a time.","Weighted dip heavy double","Heavy specific practice before pressing fatigue","Rep capacity toward six-rep target","Secondary bench maintenance; controlled one-second pause","One-arm chest-supported dumbbell row (incline bench)","First set picks a dumbbell for 8 strict reps at 2\u20133 RIR; after two comparable exposures at \u22653 RIR, go up one dumbbell step.","Horizontal pull with the chest supported, sparing the back after the long ride","One-arm chest-supported machine row or one-arm seated cable row, same dose.","Alternating dumbbell curl","First set picks a load for \u22658 clean reps at target reserve; afterwards compare with the last normal appearance of this exact exercise.","1\u20132 RIR (last set may reach 0\u20131)","superset: partner set + moves","Direct biceps hypertrophy; not counted toward compound pressing/pulling","Any familiar curl with the same implement type, same dose.","Arms are for size: 3\xD78\u201315 at 1\u20132 RIR, last set may reach 0\u20131 RIR; 60\u201390 s before the same exercise comes round again. Add reps within 8\u201315 at the next normal appearance of the SAME exercise. When all 3 sets reach 15 at target reserve, add the smallest load step next time and return toward 8\u201310. Hold triceps first if Sunday dips or Wednesday OHP ramps feel slow or elbows are sore. W6/W12: 2 easy sets at \u22654 RIR, no progression.","Lightest cable setting; elbow at the side.","Shoulder health (rotator cuff)","Band external rotation, same dose.","Bodyweight; shorten the range or lever to meet reserve.","Direct abdominal work; stable three-week block","Kneeling short-range rollout.","Keep each core exercise for its three-week block. Improve range or hold quality first; after two good exposures take the smallest load/range step, without adding sets. No swinging on hanging raises (bent knees are the regression). Hollow holds end with ~10 s of good position left. Pallof is anti-rotation, not dynamic rotation. W6/W12: 2 easy sets.","Heaviest bells that allow another 20 m with unchanged posture.","Grip and trunk stiffness; suitcase = anti-lateral flexion, not rotation","Dumbbells instead of kettlebells, same distance.","Keep 2\xD720 m. Add the smallest load step after two easy exposures with no cost to Monday grip or Wednesday recovery.","Fresh pull-up priority, conventional deadlift maintenance, moderate OHP; lunges, Copenhagen, calves and triceps.","Cut order: (1) power sets 3\u20134, (2) 3rd triceps set, (3) 3rd calf set. Never cut: pull-up, deadlift and OHP work sets, both lunge sets, Copenhagen, both Pallof sets. No exercise is ever done for just 1 set.","Monday checks: swings/snatches come before deadlifts \u2014 if the deadlift ramps feel slow, stop power at 2 sets next time. Lunges come after a Sunday long ride and deadlifts \u2014 after a hard ride weekend, hold the lunge load.","Gentle adductor rock-back \u2014 5/side","KB complex primer \u2014 2 untimed rounds: 2 double-KB cleans + 1 press + 2 front squats, light 8\u201312 kg bells, ~30 s between rounds","The KB complex in the warm-up is the rehearsal. 60 s between sets; 45 s before the pull-up ramps.","Pull-up work (fresh priority)","Bodyweight rehearsal 3/side. 75 s after each left+right pair.","Copenhagen + calves (superset)","Round = Copenhagen left, Copenhagen right, then one calf set; repeat. Put the calf station beside the Copenhagen bench. No extra rest needed: each exercise rests while its partner works (\u226560 s).","Triceps + Pallof (superset)","Use one cable column (or a band for Pallof beside it). Round = pushdown set, Pallof left+right; repeat. No extra rest needed: each exercise rests while its partner works (\u226560 s).","Two-hand kettlebell swing","A bell that allows a crisp, repeatable float at RPE \u22644 (likely 20\u201324 kg). Week 1: the first set selects the bell.","Hip-extension speed that complements the deadlift without extra heavy hinge volume","Light two-hand KB deadlift with a fast stand, same sets \xD7 3; technique fallback, not a ballistic equivalent.","After two crisp exposures: next bell size (4 kg step). Weeks 7\u201311 may move to the one-arm snatch if its gate is met.","Lower reps address supplied late-set fatigue","Conventional deadlift top double","Maintain heavy conventional capacity at the fixed Monday slot","Conventional deadlift back-off double","Second maintenance double at about 90% of the top set","Second weekly OHP exposure: submaximal practice volume","Dumbbell/kettlebell reverse lunge","Bodyweight rehearsal, then the first set picks a load that meets reserve with full balance. Record implement and load.","Knee-dominant single-leg strength","Split-stance static lunge with hand support, same dose.","Extra leg work is never cut: under fatigue lighten the load, shorten the range or add hand support instead. Two work sets per side, 3\u20134 RIR. Increase the smallest load step only after two comparable exposures at \u22653 RIR with normal adductor/hamstring response and unaffected rides, impact and main lifts. Do not raise it in a week that impact or power progresses. W6/W12: 2\xD74/side at \u22655 RIR, lighter.","Knee-supported short-lever Copenhagen","Bodyweight with hand/foot assistance as needed; stay short-lever.","One-leg dumbbell calf raise on a step","Mandatory adductor capacity; separate from the extra leg exercise","Side-lying adductor lift with the top leg supported, same sets and reps.","Keep the short lever at 3\xD76\u20138/side. The long lever is allowed only after three clean weeks and review \u2014 it is permission, not a calendar step.","Hold a dumbbell on the working side, other hand on a rack; heel drops below the step.","Straight-knee calf (gastrocnemius) strength and Achilles capacity to support sprinting","Standing Smith-machine calf raise on a plate, 3\xD78\u201315.","Calves: full range, 1-s pause in the stretched position, no bouncing, 3 RIR (week 1: 3\u20134 RIR while choosing loads). When every set reaches the top of the range with normal next-morning calf/Achilles response AND normal Wednesday pogo quality, add the smallest load step. More than mild calf soreness on Wednesday morning: hold calf load and start Wednesday impact at the lower pogo dose. W6/W12: 2 easy sets at \u22654 RIR.","Direct triceps hypertrophy; not counted toward compound pressing/pulling","Straight-bar or V-bar pushdown, same dose.","Lightest stable cable or band; pelvis and ribs stay still.","Direct core: anti-rotation (not dynamic rotation)","Band Pallof press anchored to a rack, same dose.","Impact first (\u226415 min). Fresh heavy OHP priority, pull-ups, one-arm rows; biceps for size.","Cut order: (1) power pairs 3\u20134, (2) 3rd biceps set. Never cut: OHP and pull-up work sets, row sets, face pulls, both core sets, the carry. No exercise is ever done for just 1 set.","Wednesday checks: scoop throws precede heavy OHP \u2014 keep throws at RPE \u22644 and stop at any shoulder fatigue. Monday calves are 48 h before today\u2019s pogos \u2014 see the calf rule.","General prep (walk, ankle rocks, calf raises, marching, quarter-squats) was done on the impact clock and is not repeated. If impact was skipped, add a 60 s walk and 8 ankle rocks/side from the delay reserve. Preparation only: no work-set or accessory credit. Wall slides live here and nowhere else.","Brace-and-reach \u2014 5 \xD7 3 s","Unloaded compact torso turn \u2014 4/side","Daily power + dynamic rotation #1","Rehearsal 1 easy throw per side. Rep time includes reset and ball retrieval. 60 s after each pair; 45 s before the OHP ramps. Stop at any shoulder fatigue \u2014 heavy OHP is next.","OHP work (fresh priority)","60 s between sets (each set = left then right).","Rotational medicine-ball scoop throw (to a wall)","Start with a 3 kg ball in a clear throwing area; compact pivot, no jump.","Rotational power; also dynamic rotation pattern #1 (low-to-high). One physical dose, two roles.","Landmine rotational punch, same sets \xD7 reps per side, light; still counts as dynamic rotation. Use it if there is no ball or wall space.","After two crisp exposures: +1\u20132 kg ball.","Heavy strict practice toward 130\xD72","Strict OHP back-off doubles","Quality volume at about 96% of the top double","Second vertical-pull exposure","One-arm dumbbell row (bench-supported)","Free-weight horizontal pull; one left+right pair = one set","Light rope setting; pull to the forehead with the elbows high.","Shoulder health (rear delts / external rotation)","Band face pull or reverse fly, same dose.","Impact and sprints first. Low-bar squat maintenance, dips, DB incline bench, pull-ups; single-leg RDL, Copenhagen, calves and triceps.","Cut order: (1) power sets 3\u20134, (2) 3rd triceps set, (3) 3rd calf set, then (4) skip DB incline bench entirely \u2014 both sets, never just one (press drops to 18; the single-leg RDL then runs alone with 75 s between pairs). Never cut: squat, dip, both pull-up sets (vertical floor 8), both single-leg RDL sets, Copenhagen, prone Y, both landmine rotation sets. No exercise is ever done for just 1 set.","Friday checks: power comes after impact \u2014 if cleans are slow, do 2 sets only. DB incline bench is supersetted with the single-leg RDL \u2014 hold incline\u2019s 2nd set first if squat or dip felt heavy. The single-leg RDL itself still follows squats \u2014 lighten it if hamstrings or lower back are tired.","Gentle hip rock-back \u2014 5/side","Brace rehearsal \u2014 3 \xD7 5 s","The KB complex in the warm-up is the rehearsal. 60 s between sets; 45 s before the next ramps.","Single-leg RDL + DB incline bench (superset)","Round = single-leg RDL (both sides), then a DB incline set; repeat. A single-leg hinge and a chest press use different muscles, so they share rest instead of each needing its own recovery. No extra rest needed: each exercise rests while its partner works (\u226560 s).","Triceps + prone Y (superset)","Incline bench beside the cable column. Round = triceps set, prone Y set; repeat. No extra rest needed: each exercise rests while its partner works (\u226560 s).","Two gentle rehearsal reps/side, then work; 60 s after each pair.","Double-kettlebell clean (from the hang)","A pair that racks crisply and quietly (likely 2\xD716 kg). Week 1: the first set selects the pair.","fast intent, quiet rack, RPE \u22644","Full-body extension power after the plyo session; no landings","Trap-bar jump, about 95\u2013135 lb, same sets \xD7 reps (its landings count as moderate plyo contacts). If no trap bar: two-hand swing 4\xD75.","After two crisp exposures: next bell size for both bells.","Low-volume specific squat capacity; consistent depth","Moderate dip practice; first pressing lift of the day","Third low-rep exposure; preserve form","Dumbbell incline bench press","First set picks a dumbbell pair for 8 strict reps at 2\u20133 RIR; after two comparable exposures at \u22653 RIR, go up the smallest available step.","Dumbbell/kettlebell single-leg RDL","Second weekly press variation, added for upper-chest volume; secondary to paused bench, never the fresh slot","Flat dumbbell bench press, same dose, if an incline bench is unavailable.","Add the smallest dumbbell step after two comparable exposures at \u22653 RIR with normal shoulder/elbow response. Hold if Friday squat or dip ramps felt slow.","Single-leg hinge strength after squats; light hand support allowed, free foot stays off the floor","Kickstand (staggered-stance) dumbbell RDL, same dose.","Machine; first set picks a load for 12+ paused reps.","Bent-knee calf (soleus) capacity for repeated sprint and jump contacts","Seated dumbbell-on-knees calf raise, forefoot on a plate, same dose.","Overhead cable triceps extension","Seated two-hand dumbbell overhead extension, same dose. No skull crushers.","Very light plates or dumbbells; lower traps do the work, no shrug.","Shoulder health (lower trapezius / upward rotation)","Prone T/Y on the floor, same dose.","Light lever you can control; smooth pivot, comfortable range.","Direct core + dynamic rotation pattern #2 (high-to-low)","High-to-low cable chop, same dose.","Medicine-ball chest pass to a wall","Start with a 3\u20134 kg ball; throw hard from the chest, catch the rebound softly.","Plyometric push-up, same sets and reps.","~10 s of good position left","Standing barbell or Smith calf raise on a plate","Barbell on the back (or Smith), forefoot on a plate; choose a load for full, paused reps.","Straight-knee calf (gastrocnemius) strength under heavier load","Standing calf-raise machine, same dose.","Short-range ab wheel if no sliding surface.","Bent-knee calf raise with 3-s stretch pause","Seated machine or dumbbells on the knees; hold the bottom stretch 3 s every rep.","Bent-knee calf (soleus) strength through the stretched range","Seated calf raise, 3\xD712\u201320.","Deload week: planned well under 75 minutes, so no cuts are expected. Every exercise is already at its 2-set minimum \u2014 never drop one to 1 set. If time or fatigue forces a cut, skip a whole optional exercise instead (Friday: DB incline bench), and log it.","Same familiar version, easy. Start with a 3\u20134 kg ball; throw hard from the chest, catch the rebound softly.","Heaviest bells that allow another 20 m with unchanged posture; lighter this week.","Same familiar bell or lighter; no progression.","Conventional deadlift (light technique, C02)","Weekly conventional practice at deload intensity (10 heavy + 2 light weeks)","Very light familiar ball; technique only, no progression.","Longer pull-up set: weeks 8 and 10 use the load you actually handled for the preceding 4-rep set. Week 11 allows 4\u20135 reps, stopping at 2\u20133 RIR. Repeat 4 reps or reduce load if needed; the triples may use the last successful lower load. No catch-up, no extra sets.","One-arm kettlebell snatch (if gate met)","Start 12\u201316 kg. GATE: swings were crisp at the current bell for two exposures AND your snatch has no arm pull and a quiet lockout. If not, do two-hand swings 4\xD75 at your current bell instead.","Hip-extension speed finished overhead; complements the deadlift without extra heavy hinge volume","Two-hand KB swing 4\xD75 at the current bell (fits the same block).","After two crisp exposures: next bell size (4 kg step).","Neutral-grip pull-up target-rep practice","Longer first set builds and checks five-rep readiness; target reserve overrides nominal load","Neutral-grip pull-up triples","Lower-rep follow-up work preserves repeat quality","Test rules: two easy days before each test session, no red tissue domain, normal gait. Readiness singles are strict, crisp and about RPE \u22647; they allow the attempt, they do not prove it. ONE target set per lift. Stop before a grinding or invalid rep; no retries. OHP success = 130\xD72 strict at RPE \u22649. Dip success = +50\xD76, elbows below 90\xB0, controlled lockout, \u22652 RIR. Pull-up success = +45\xD75 from a dead hang on the usual neutral handles, chin clearly over, \u22652 RIR. Record RPE/RIR right after the set; video recommended. An unattempted test may move to the week-13 makeup (Sat Dec 26). A failed or grinding attempt is recorded as not achieved.","ONE target set. Stop before a grinding or invalid rep; no retry.","Neutral-grip pull-up target test","Preparation (general warm-up, counted here once)","60 s walk; ankle rocks 8/side; calf raises 8; march 10 steps/side; 5 quarter-squats; readiness check","Low-hurdle hops (15\u201320 cm, bilateral)","2\xD76; 30 s between sets; 30 s setup","Moving between drills, markers and measuring","If time or tissues say so, cut contacts from the highest tier down \u2014 never the preparation or the rests. Log the smaller actual dose; it never qualifies the next stage. No make-up impact after lifting or on Saturday.","Plyo and sprints come before lifting, never after a hard ride or tiring lifting. Progress only after two tolerated exposures with normal next mornings. If today is cut short, log the actual contacts and metres; a cut session never qualifies the next stage. No make-up impact after lifting or on Saturday. Contact counting: each ground contact = 1; a bilateral landing = 1; per-leg work counts per leg (none prescribed).","Forward-back line hops (bilateral)","Submaximal broad jumps (~75%) in doubles","Gentle pre-sprint adductor squeeze","3\xD720 s, 20 s between; ~20\u201330% effort","Measured route, clear runout and a gradual stop; no extra accelerations","Accelerations with equal-distance easy runout","4\xD715 m on ~5% hill, build to ~75%; 120 s after each runout before the next rep","5 sets \xD7 2 jumps (jump, reset, jump); 30 s between sets","3\xD75; 30 s between sets; 30 s setup","6\xD715 m on ~5% hill, build to ~75%; 120 s after each runout before the next rep","3\xD76; 30 s between sets; 30 s setup","Low depth jumps (30 cm box, rebound to max height, stick)","sets of 2/2; 60 s before the first set, 90 s between sets","6 sets \xD7 2 jumps (jump, reset, jump); 30 s between sets","sets of 4/4; 60 s before the first set, 90 s between sets","6\xD720 m on ~5% hill, build to ~75%; 150 s after each runout before the next rep","Maximal standing broad jumps (singles)","4 singles; 60 s before the first, 90 s between; measure only if you want to \u2014 not a test","7 sets \xD7 2 jumps (jump, reset, jump); 30 s between sets","4\xD720 m on flat, build to ~75%; 150 s after each runout before the next rep","4\xD75; 30 s between sets; 30 s setup","4\xD720 m on flat, 85\u201390%; 180 s after each runout before the next rep"],fu={1:{sun:{date:"2026-09-27",phase:"Accumulation start",objective:0,minutes:71,seconds:4260,secondsIfMaxRests:4410,cuts:1,sequencing:2,notes:[],blocks:[{name:"Warm-up",seconds:240,minutes:4,detail:3,drills:["Brisk walk \u2014 60 s",4,5,"Wall slides \u2014 8",6,"Unloaded hip hinge \u2014 5"],ramps:null},{name:"Daily power",seconds:360,minutes:6,detail:7,drills:null,ramps:null},{name:"Dip ramps",seconds:360,minutes:6,detail:8,drills:null,ramps:[{w:"BW",r:5},{w:15,r:3},{w:30,r:1}]},{name:9,seconds:600,minutes:10,detail:10,drills:null,ramps:null},{name:"Bench ramps",seconds:480,minutes:8,detail:8,drills:null,ramps:[{w:45,r:8},{w:95,r:5},{w:135,r:3},{w:165,r:1}]},{name:"Paused bench work",seconds:390,minutes:6.5,detail:10,drills:null,ramps:null},{name:"Row",seconds:630,minutes:10.5,detail:11,drills:null,ramps:null},{name:12,seconds:540,minutes:9,detail:13,drills:null,ramps:null},{name:"Core",seconds:180,minutes:3,detail:"60 s between sets.",drills:null,ramps:null},{name:"Carry",seconds:180,minutes:3,detail:"60 s between sets.",drills:null,ramps:null},{name:"Delay reserve",seconds:300,minutes:5,detail:14,drills:null,ramps:null}],items:[{id:"plyopush",name:15,tag:"power",family:"power",cut:"first",protectedSets:2,sets:4,reps:"3",repsNum:3,repsMax:3,load:null,loadText:16,rir:"fast intent, RPE \u22644",rest:60,restNote:null,supersetWith:null,purpose:17,perSide:!1,system:!1,clock:"strength",wo @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');
.app{min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;font-size:14px;max-width:520px;margin:0 auto;transition:background .25s}
.app *{box-sizing:border-box;margin:0;padding:0}

.app .inlbtn,.app .ghost,.app .solid,.app .finishbtn{border-style:solid}

.app .rxfill{border-style:dashed}
.app .step,.app .warm-toggle,.app .wave-col{border:none}
.app input,.app textarea{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;width:100%;min-height:44px;text-align:center;background:var(--inputBg);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:8px;transition:border-color .15s,color .15s}
.app textarea{font-family:'Inter';font-size:13px;font-weight:400;text-align:left;min-height:64px;resize:vertical;line-height:1.5}
.app input:focus,.app textarea:focus{outline:none;border-color:var(--accent)}
.app input::placeholder,.app textarea::placeholder{color:var(--faint)}
.app input.warn{border-color:var(--warn);color:var(--warn)}
.app input.under{border-color:var(--warn);color:var(--warn);background:color-mix(in srgb,var(--warn) 8%,var(--inputBg))}
.app input.over{border-color:var(--ok);color:var(--ok);background:color-mix(in srgb,var(--ok) 8%,var(--inputBg))}

.week-title{text-align:center}

.progress b{color:var(--accent)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;margin-bottom:12px}
.card.main{border-color:var(--mainLine);background:var(--mainBg)}
.card.skipped{opacity:.55}
.card.exdone{border-color:var(--ok)}
.card.exdone .ex-head h2{color:var(--muted)}
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;min-width:0}
.ex-title{flex:1;min-width:0}
.ex-head h2{font-size:15px;font-weight:600;line-height:1.2}

.finishbtn.done-on{background:transparent;border-color:var(--ok);color:var(--ok)}
.summary{background:var(--panel);border:1px solid var(--ok);border-radius:10px;padding:12px;font-size:12.5px;line-height:1.6;color:var(--ink);margin-top:10px}

.foot{text-align:center;font-size:10.5px;color:var(--faint);margin-top:20px;line-height:1.6}

.timer-act{min-height:44px;min-width:56px;border:0.5px solid color-mix(in srgb,var(--accent) 6%,transparent);border-radius:8px;font-family:'Barlow Condensed';font-weight:700;font-size:15px;color:var(--ink)}
.timer-act.stop{min-width:44px;color:var(--muted)}
.test-note{font-size:12px;color:var(--muted);line-height:1.55;margin-bottom:12px}
.tested-row{display:flex;gap:10px;align-items:center;margin-top:12px}

.tested-row input{flex:1}
.settings .set-label{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:14px 0 8px}
.syncdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn);margin-right:6px;vertical-align:middle}
.syncstatus{font-size:12.5px;line-height:1.45;color:var(--muted);overflow-wrap:anywhere}
.syncstatus.t-ok{color:var(--ok)}
.syncstatus.t-warn,.syncstatus.t-bad{color:var(--warn)}
.syncexp{color:var(--faint)}
.synckey{font-family:'Inter'!important;font-size:14px!important;font-weight:400!important;text-align:left!important;padding:8px 12px!important;margin-top:8px;box-sizing:border-box}
.syncrow{display:flex;gap:8px;margin-top:8px}
.sync-full{width:100%;margin-top:8px;flex:none}
.cloudrestore{margin-top:10px;padding:10px 12px;border:0.5px solid color-mix(in srgb,var(--accent) 10%,transparent);border-radius:9px;font-size:12.5px;line-height:1.5;color:var(--ink);overflow-wrap:anywhere}
.cloudrestore p{margin:0 0 8px}
.reviewcard{padding:0;overflow:hidden}
.reviewcard>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.reviewcard>summary::-webkit-details-marker{display:none}
.rev-title{font-family:'Barlow Condensed';font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);overflow-wrap:anywhere}
.rev-status{flex:none;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.rev-status.st-approved{color:var(--ok)}
.rev-status.st-declined{color:var(--faint)}
.rev-body{padding:0 14px 12px}
.rev-p{font-size:12.5px;line-height:1.5;color:var(--ink);margin:0 0 8px;overflow-wrap:anywhere}
.rev-p b{color:var(--accent)}
.rev-h{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:10px 0 4px}
.rev-row{font-size:12.5px;line-height:1.5;color:var(--ink);padding:6px 0;border-top:0.5px solid var(--line);overflow-wrap:anywhere}

.revline{border-left:3px solid var(--slate);background:var(--inputBg);border-radius:0 8px 8px 0;padding:7px 10px;margin:8px 0 0;font-size:12px;line-height:1.5;color:var(--ink);overflow-wrap:anywhere}

.revline.sugg{border-left-color:var(--accent)}
.revline.sugg b{color:var(--accent)}
.revhist{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:6px 0;border-top:0.5px solid var(--line);color:var(--ink);overflow-wrap:anywhere}
.revhist span:last-child{color:var(--faint);flex:none}
.tag.adj-tag{border:0.5px solid color-mix(in srgb,var(--accent) 40%,transparent);color:var(--accent);background:transparent;font-family:'Inter'}

.revprompt b{color:var(--accent)}

.sw-accent{width:10px;height:10px;border-radius:99px}
.sw-name{font-size:9.5px;color:var(--muted)}
.swatch.on .sw-name{color:var(--accent)}

.seg-btn.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.dayrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.dayrow-name{flex:0 0 72px;font-size:12px;font-weight:600}
.daypick{display:flex;gap:4px;flex:1}
.daybtn{flex:1;min-height:34px;border:0.5px solid color-mix(in srgb,var(--accent) 6%,transparent);border-radius:7px;font-family:'Barlow Condensed';font-weight:700;font-size:12px;color:var(--muted)}
.daybtn.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.toggle-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line);margin-top:10px;font-size:13px}
.pill{min-width:64px;min-height:36px;border:0.5px solid color-mix(in srgb,var(--accent) 6%,transparent);border-radius:99px;color:var(--muted);font-family:'Barlow Condensed';font-weight:700;font-size:13px;letter-spacing:.05em;text-transform:uppercase}
.pill.on{border-color:var(--ok);color:var(--ok)}
.card.dragging{position:relative;z-index:50;box-shadow:0 10px 28px rgba(0,0,0,.45);cursor:grabbing}
.card.dragging .draghandle{color:var(--accent)}

.bs-label{flex:0 0 auto;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.barspeed{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;flex:1}
.bs-btn{min-height:34px;border:0.5px solid color-mix(in srgb,var(--accent) 6%,transparent);border-radius:8px;background:transparent;color:var(--muted);font-family:'Barlow Condensed';font-weight:700;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
.bs-btn.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.sessiontime{text-align:center;font-family:'Barlow Condensed';font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.sessiontime b{color:var(--accent);font-size:15px;font-weight:700}
.sessionclock{font-variant-numeric:tabular-nums}
.resetorder{display:block;margin:0 auto 12px;color:var(--muted);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;background:none;border:none;text-decoration:underline}
/* \u2500\u2500 Astra block: cut-priority chips, elastic / sprint / primer / adductor cards \u2500\u2500 */
.tag.cut-never{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.tag.cut-second{color:var(--slate);border-color:color-mix(in srgb,var(--slate) 40%,transparent)}
.tag.cut-first{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.systemload{font-size:11.5px;color:var(--muted);padding:8px 0 0;letter-spacing:.02em}

/* set rows: the top set and the week-1 calibration single read differently from back-offs */

.set-row.calibrow{background:color-mix(in srgb,var(--slate) 10%,transparent)}
.set-row.calibrow .set-n{color:var(--slate);font-weight:700}
.rxfill:disabled{opacity:.3}

.tierrow{border-top:1px solid var(--line);padding:10px 0 2px}

.tierlog input{flex:0 0 72px;text-align:center}
.tierlog .rxfill{flex:0 0 42px}
.qrow{display:flex;align-items:center;gap:8px;margin-top:10px}
.tested-row.baseline{border-top:1px solid var(--line);padding-top:12px}

.sprintmeta .ok{color:var(--ok)}
.sprintmeta .warn-txt{color:var(--warn)}
/* adductor gate */
.checkcard.alert{border-color:var(--warn)}
.checkrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.checklbl{flex:0 0 118px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.checkrow .barspeed{grid-template-columns:repeat(2,1fr)}
.bs-btn.on.ok{border-color:var(--ok);color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.bs-btn.on.bad{border-color:var(--warn);color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.abnormal{border-top:1px solid var(--warn);margin-top:10px;padding-top:10px}
.abnormal p{font-size:12px;line-height:1.55;color:var(--ink);margin:0 0 8px}
.abnormal .escalate{color:var(--warn);font-size:11.5px;line-height:1.55;margin-top:8px}
/* volume floor audit */
.volaudit{margin-bottom:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.volaudit summary{padding:10px 12px;font-family:'Barlow Condensed';font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.voltable{padding:0 12px 10px}
.volrow{display:grid;grid-template-columns:1fr 40px 62px 54px;gap:6px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.volrow b{color:var(--ink);font-family:'Barlow Condensed';font-size:14px;text-align:right;font-variant-numeric:tabular-nums}
.volfloor{text-align:right;font-size:10.5px;color:var(--faint)}
.volok{color:var(--ok);text-align:right;font-size:10px;letter-spacing:.07em;text-transform:uppercase}
.volbad{color:var(--warn);text-align:right;font-size:10px;letter-spacing:.07em;text-transform:uppercase}
.volwaived{color:var(--slate);text-align:right;font-size:10px;letter-spacing:.07em;text-transform:uppercase}
/* The session's timed block plan. Single column so the long detail text wraps instead of
   forcing horizontal scroll at 375px \u2014 the same trap .rx fell into. */
.blockplan{padding:0 14px 12px}
.blockplan .blockrow{display:block;padding:8px 0;border-top:1px solid var(--line)}
.blockmin{font-family:'Barlow Condensed';font-weight:700;font-size:12px;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:.04em;margin-right:8px}
.blockname{font-family:'Barlow Condensed';font-weight:600;font-size:13px;color:var(--ink);text-transform:uppercase;letter-spacing:.05em}
.blockdetail{display:block;font-size:11.5px;color:var(--muted);line-height:1.45;margin-top:4px}
.tab.testtab .tab-lift{color:var(--accent)}
