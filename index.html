l missed ratio; never add fatigued pulling or rewrite history. Saturday stays rest.","Prepare the day\u2019s joint positions and first power movement. No general KB circuit. Wall slides are preparation, with zero accessory/work-set credit. Take longer if needed and log it.","Thoracic rotations \u2014 6/side","Scapular depressions \u2014 5 \xD7 3 s","Rehearsal: 1\xD72/side with a lighter bell (or 1\xD73/side of the selected speed-row fallback), including a 20 s side change; 40 s allowance. Then 30 s before first work set; full 90 s between sets/pairs and 60 s before the first main-lift ramp. Extend to 120 s if quality requires it; log extra time. Rehearsals add physical practice but no productive strength-set credit. Independent-arm chest-supported machine speed row, same sets, 3/side, \u226450% of that day\u2019s chosen normal row load, fast pull/2 s return; same rest. Upper-body alternative, not an equivalent ballistic stimulus.","Each listed rest follows that ramp, including the final recovery before work. Equipment/loading changes are additional and explicitly budgeted; no accessory supersets.","Full rest between every work set, including a change from top set to back-offs. No work during priority recovery.","One easy 6-rep ramp (per side for Wednesday), 60 s before work. 3 s/work rep. 20 s to switch sides; rest 90 s after each complete pair. Use the machine designed for independent-arm work.","After priority lifts, never inserted into their rests. Wall slides do not replace this dose.","Time budget uses 12 reps per set in normal weeks, both arms for alternating curls. All other named curls use simultaneous arms. No second arm isolation exercise.","Full between-set rest. For landmine/cable rotation, rehearsal is 2 gentle reps/side including the side change; do not add a separate heavy trunk warm-up.","One 20 m walk at controlled pace, ~25 s. Wednesday completes both sides. No interset rest because there is only one pair.","Unallocated station/recovery/logging allowance; do not fill with extra sets. Strength duration is a guideline, not a mandatory stop. Friday has more available time.","Single-arm kettlebell clean","First technical trial: 8 kg or lighter; use a previously established crisp working bell if technique is already known. Thereafter last successful clean load; never infer it from deadlift strength.","RPE \u22644; fast intent; no local fatigue","Unilateral ballistic coordination after the ride, without a third meaningful lower strength day","Independent-arm chest-supported machine speed row, same sets, 3/side, \u226450% of that day\u2019s chosen normal row load, fast pull/2 s return; same rest. Upper-body alternative, not an equivalent ballistic stimulus.","Power is fast, forceful practice with low fatigue, not a circuit. Select a load permitting crisp repeatable reps; stop at visible slowing, unstable rack/landing, arm-dominant clean, local fatigue, or deterioration of the next main-lift ramp. Use 90 s between normal sets/pairs; extend to 120 s or longer if required, with time logged. After TWO comparable crisp exposures and normal next-day response, increase only the smallest suitable load step at the next normal occurrence. Hold when that increment is too large. Do not raise power load and leg-accessory load or impact stage in the same week. No added sets are needed in this baseline. W6/W12 reduce dose and load/effort, using a familiar version. A stopped movement is logged as omitted; no checklist overrides symptoms.","Weighted dip heavy double","Heavy specific practice before pressing fatigue","Rep capacity toward six-rep target","Secondary bench maintenance; controlled one-second pause","Chest-supported machine row","Light trial on the actual machine \u2192 stated reserve; save setting and ROM. Increase smallest load only after two comparable successful exposures; reduce in W6/W12.","Horizontal pulling without additional lumbar loading","Chest-supported independent-arm lever/T-bar machine for unilateral work; bilateral chest-supported machine/T-bar/seal row for Sunday. If no independent-arm station exists Wednesday: use bilateral chest-supported rows at the same set count AND replace its suitcase carry with one-arm overhead KB hold 1\xD715 s/side, easy, no press reps. This separate upper-limb hold supplies unilateral work and costs \u2264the carry allowance; flag the lost carry exposure, a flexible floor.","Lightest practical cable setting / bodyweight or very light plates for Y; record a comfortable setting, reduce as needed","Protected genuine shoulder accessory; easy control, not a claim of injury prevention","Band external rotation 2\xD712/side, same reserve/rest/side-change allowance.","Alternating dumbbell curl","First prescribed set: select light load at stated reserve; thereafter compare with last normal occurrence of THIS variation.","Direct biceps only; separately counted from compound pulling","Normal curls: 2\xD78\u201312 at 3 RIR, 75 s between sets. First prescribed set selects a light working load; no extra failure test. On the next NORMAL appearance of that same variation add reps while preserving ROM/reserve. After BOTH sets reach 12, increase the smallest suitable load next normal appearance and return toward 8. Compare only the same implement/setting; deload appearances neither qualify an increase nor reset the record. W6/W12: 1\xD78 at \u22655 RIR with reduced load. Alternating curls count 8\u201312 per arm.","bodyweight; shorten controlled ROM/lever to meet reserve","Direct abdominal control with a stable three-week exercise block","Bent-knee hanging raise if straight-leg raises swing; for body saw use safe sliders/towel on a suitable surface, otherwise the already familiar short-range ab wheel; hollow hold may use a tucked lever. No uncontrolled repetitions.","Keep the printed core variation for its three-week block. Start with a short controlled range; after two comparable successful exposures improve ROM, or the smallest load step for cable/landmine work, without adding sets or changing a second variable. No swinging on hanging raises; use bent knees if necessary. Hollow holds end with ~10 s of good-position capacity left. W6/W12 use the reduced familiar dose and \u22655 RIR/large position reserve. Pallof is anti-rotation, not dynamic rotation.","Light bells allowing another 20 m with unchanged posture; do not chase grip fatigue","Carry exposure; suitcase is anti-lateral flexion, not dynamic rotation","Hold distance and set count throughout. Increase smallest load only after two easy comparable exposures with no cost to Monday pull-ups/deadlift grip or Wednesday recovery. Lighter in W6/W12.","Fresh pull-up priority, fixed conventional-deadlift exposure, moderate OHP and Copenhagen.","If local fatigue or schedule binds: added lunge dose first, then a Pallof set; do not relabel Copenhagen as the additional accessory. Preserve safe pull-up, conventional and second OHP exposure. If protected work still cannot fit the real window, record the missed work and revise rather than rush rests. One lost pulling set gives 18/14=1.286, but a row cut breaks the six-row floor. Two lost pulling sets give 18/13=1.385: prospectively reduce secondary pressing to \u226416, giving 16/13=1.231. If pressing is already completed, report the actual missed ratio; never add fatigued pulling or rewrite history. Saturday stays rest.","Gentle adductor rock-back \u2014 5/side","Rehearsal: 1\xD75 lighter swings or 1\xD73 selected fast-stand fallback; 30 s including reset. Then 30 s before first work set; full 90 s between sets/pairs and 60 s before the first main-lift ramp. Extend to 120 s if quality requires it; log extra time. Rehearsals add physical practice but no productive strength-set credit. Light two-hand KB deadlift, same sets, 3 reps, fast stand and controlled return without release/jump; 90 s rest. Technique/fast-intent fallback, not a ballistic equivalent.","Unloaded rehearsal 2/side in reduced weeks, 3/side otherwise; rehearsal includes side change. Only ONE work pair, so no between-work-set rest. Take longer between sides if necessary.","2 s up + 2 s down; 30 s to change sides each pair; 45 s after each of the first two complete pairs. Three pairs = six side-sets.","Two-hand kettlebell swing","First trial: 8\u201312 kg; then last technically qualified crisp working bell, with the printed progression gate.","RPE \u22644; fast hip snap; no grinding","Brief hip power before pull-ups; deadlift follows later, with full ramps","Light two-hand KB deadlift, same sets, 3 reps, fast stand and controlled return without release/jump; 90 s rest. Technique/fast-intent fallback, not a ballistic equivalent.","Lower reps address supplied late-set fatigue","Specific capacity maintenance; reset each rep, no grinding","Second productive OHP exposure; not an optional third primer","Unloaded rehearsal, then light DB/KB load meeting reserve and balance; start bodyweight for the lunge if needed. Record chosen load.","Additional knee-dominant unilateral leg accessory","Assisted reverse lunge with reduced ROM/load","Additional leg work: one paired work set at 4 RIR, with support/ROM that preserves control. Begin with the printed unloaded rehearsal; choose a light load using the first prescribed work pair, not an extra capacity test. After two comparable normal exposures with \u22654 RIR, normal next-day response and unaffected rides, impact and main lifts, increase the smallest load step only. Otherwise hold; reduce load/ROM or increase balance support if needed. Do not increase this load in a week that impact or power progresses. W6/W12: 1\xD74/side at \u22655 RIR, lighter and familiar. Copenhagen remains separate and mandatory when tolerated.","Knee-supported short-lever Copenhagen","bodyweight with hand/foot assistance as needed; stay short-lever","Mandatory adductor capacity, separate from the added leg exercise","Keep 3\xD76/side and the short lever through this block. Long-lever change requires at least three weeks clean tolerance and review, not an automatic calendar step. Assist more in W6/W12.","Lightest stable cable/band resistance; pelvis and ribcage remain controlled","Direct abdominal anti-rotation; does not count as dynamic rotation","Fresh heavy OHP priority; pull-ups, rows and protected shoulder/trunk work.","If time or recovery binds: final biceps set \u2192 carry \u2192 a row set (row-floor waiver). Protect OHP, pull-ups and shoulder work. Stop/regress throws if they impair OHP; a missing rotation/power exposure is recorded honestly. One lost pulling set gives 18/14=1.286, but a row cut breaks the six-row floor. Two lost pulling sets give 18/13=1.385: prospectively reduce secondary pressing to \u226416, giving 16/13=1.231. If pressing is already completed, report the actual missed ratio; never add fatigued pulling or rewrite history. Saturday stays rest.","Brace-and-reach \u2014 5 \xD7 3 s","Unloaded compact torso turn \u2014 4/side","Rehearsal: 1\xD71/side with the lightest ball/cable setting, including 20 s side change and retrieval; 36 s. Then 30 s before first work set; full 90 s between sets/pairs and 60 s before the first main-lift ramp. Extend to 120 s if quality requires it; log extra time. Rehearsals add physical practice but no productive strength-set credit. Low-to-high cable lift: same sets/reps per side, lightest smooth setting, fast outward phase/controlled return; same side changes and 90 s rests. This preserves a distinct dynamic pattern but is not a ballistic throw.","Rotational medicine-ball scoop throw","Light 1\u20132 kg ball initially, only in a permitted clear throwing area. Then the smallest load that preserves crisp release.","Fast intent; RPE \u22644, ~3 in W6/W12; no shoulder fatigue","Power plus first dynamic rotation; rep time includes reset and ball retrieval","Low-to-high cable lift: same sets/reps per side, lightest smooth setting, fast outward phase/controlled return; same side changes and 90 s rests. This preserves a distinct dynamic pattern but is not a ballistic throw.","Repeat strict full-ROM practice","Second vertical-pull exposure","Single-arm chest-supported machine row","Three paired left/right sets = THREE horizontal sets, not six; both sides fully timed","Familiar bilateral prone Y/T 2\xD712, same easy reserve and 60 s rest; same two-arm timing allowance. An unplanned unilateral replacement needs a new clock.","Squat-centered lower session; moderate dips and pull-ups; Copenhagen. Impact occurs first.","If recovery binds: added single-leg hinge first, then reduce nonessential remaining work. More available time is for full preparation/recovery, not bonus sets. Protect safe tests/main lifts and shoulder/adductor work; symptoms override any cut label. One lost pulling set gives 18/14=1.286, but a row cut breaks the six-row floor. Two lost pulling sets give 18/13=1.385: prospectively reduce secondary pressing to \u226416, giving 16/13=1.231. If pressing is already completed, report the actual missed ratio; never add fatigued pulling or rewrite history. Saturday stays rest.","Gentle hip rock-back \u2014 5/side","Brace rehearsal \u2014 3 \xD7 5 s","Standing broad jump \u2014 daily power","maximal intent only with readiness","Existing measured/training jump supplies Friday power; no additional cleans or landings","If high work is not ready, only already tolerated low-tier pogos from the impact card may serve as a reduced power exposure. No added contacts; absent impact means power is omitted and logged.","Follow impact gates and fixed contact ledger; no load progression. W1/W12 are approved measurement exceptions, not routine volume.","Low-volume specific squat capacity; consistent depth","Moderate dip practice; first pressing lift of the day","Third low-rep exposure; preserve form","Supported dumbbell single-leg RDL","Additional single-leg hinge after squat/main lifts; hand support allowed, free foot stays off floor","Same single-leg hinge with lighter load/shorter ROM and hand support; no substitution to the excluded bilateral variation","Unloaded/light lever only if controllable. Otherwise choose light high-to-low cable chop from the first exposure.","Second distinct dynamic rotational pattern; controlled pivot, comfortable ROM","High-to-low cable chop, identical sets/reps/reserve/rest. Distinct from Wednesday\u2019s low-to-high lift fallback. Avoid forced lumbar twisting; choose the familiar version before reduced weeks.","Specific two-rep strength","Rehearsal: 1\xD72 lighter cleans, or 1\xD75 selected swing / 1\xD73 fast-stand fallback; 30 s including reset. Then 30 s before first work set; full 90 s between sets/pairs and 60 s before the first main-lift ramp. Extend to 120 s if quality requires it; log extra time. Rehearsals add physical practice but no productive strength-set credit. Familiar two-hand swing, same sets of 5 with 90 s rest; otherwise light two-hand KB deadlift, same sets of 3 with fast stand/controlled return. Do not learn a new fallback in W6.","First trial: two 8 kg bells or lighter; then last technically qualified working pair.","RPE \u22644; quiet rack; ~3 in W6","Brief power after impact and before squat ramps in weeks without maximal jumps","Familiar two-hand swing, same sets of 5 with 90 s rest; otherwise light two-hand KB deadlift, same sets of 3 with fast stand/controlled return. Do not learn a new fallback in W6.","at least ~10 s of position reserve","Same familiar implement, lighter than the last successful normal exposure as needed; no progression. First technical trial: 8 kg or lighter; use a previously established crisp working bell if technique is already known. Thereafter last successful clean load; never infer it from deadlift strength.","RPE about 3; crisp technique, ample reserve","Same familiar implement, lighter than the last successful normal exposure as needed; no progression. First trial: 8\u201312 kg; then last technically qualified crisp working bell, with the printed progression gate.","Same familiar implement, lighter than the last successful normal exposure as needed; no progression. Light 1\u20132 kg ball initially, only in a permitted clear throwing area. Then the smallest load that preserves crisp release.","Neutral-grip pull-up target-rep practice","Longer first set builds and checks five-rep readiness; target reserve overrides nominal load","Neutral-grip pull-up triples","Lower-rep follow-up work preserves repeat quality","Ten minutes before the next lift\u2019s ramps; longer if necessary. Meaningful fatigue defers the next target, rather than forcing it.","125\xD72 target; strict, settled start","+50\xD76 target; consistent deep ROM","Neutral-grip pull-up target test","+45\xD75 target; standardized strict ROM","60 s walk; ankle rocks 8/side; calf raises 8; march 10 steps/side; 5 quarter-squats; readiness check","3\xD76 over 5\u201310 cm markers; 60 s between sets; 30 s setup","Ordinary transitions / measuring","Marker changes, measurement and movement between drills not already counted","Start the clock before travel. Compare actual transit/setup plus this full prescription with the cap BEFORE work. Cut last run (normally 132 s saved), then final high training jump (100 s), then another run; Wednesday cut the final high training jump or final moderate set as applicable. Preserve full preparation/rest. A test needs all three planned attempts for the best-of-three protocol; if it cannot fit, defer the measurement rather than call a partial test complete. Record actual contacts/meters; reduced work does not qualify a larger stage. No make-up impact after lifting or on Saturday.","Progress only after two actually tolerated exposures of the same relevant mode/stage and normal next mornings. Running exposures and jump exposures are separate. Deload technique does not qualify a higher stage; restore only a dose actually tolerated before deload. Outside approved test, first-entry and post-deload restoration exceptions, compare actual weekly contacts by tier with the last completed comparable normal week: keep any increase \u226415% (round down to whole contacts); small high-tier totals usually mean hold. Time/symptom cuts do not authorize a larger automatic next-week dose. Review any proposed upward exception. No faster run stage is added because Friday has more time.","One at 50% and one at 70%; 60 s between; reset included","Standing broad jump measurement","3 single attempts; 120 s after last rehearsal, 180 s between attempts","Gentle pre-run adductor squeeze","3\xD720 s, 20 s between; ~20\u201330% effort, not a clearance test","Check measured route, clear runout and gradual stopping; no extra accelerations","Accelerations with equal-distance runout","3\xD715 m + 15 m easy runout each, ~5% hill, 70% perceived effort; 120 s after completing runout before next rep","3\xD720 m + 20 m easy runout each, ~5% hill, 70% perceived effort; 120 s after completing runout before next rep","Standing broad jump training","4 single attempts; 90 s after last rehearsal and between attempts","2 single attempts; 90 s after last rehearsal and between attempts","3\xD720 m + 20 m easy runout each, flat, 70% perceived effort; 120 s after completing runout before next rep"],Di={1:{sun:{objective:0,minutes:68.5,seconds:4110,cuts:1,blocks:[{name:"Warm-up",seconds:240,minutes:4,detail:2,drills:["Brisk walk \u2014 60 s",3,4,"Wall slides \u2014 8","Unloaded hip hinge \u2014 5"],ramps:null},{name:"Daily power",seconds:360,minutes:6,detail:5,drills:null,ramps:null},{name:"Dip ramps",seconds:360,minutes:6,detail:6,drills:null,ramps:[{w:"BW",r:5},{w:15,r:3},{w:30,r:1}]},{name:"Dip work",seconds:690,minutes:11.5,detail:7,drills:null,ramps:null},{name:"Bench ramps",seconds:480,minutes:8,detail:6,drills:null,ramps:[{w:45,r:8},{w:95,r:5},{w:135,r:3},{w:165,r:1}]},{name:"Bench work",seconds:450,minutes:7.5,detail:7,drills:null,ramps:null},{name:"Horizontal row",seconds:420,minutes:7,detail:8,drills:null,ramps:null},{name:"Shoulder health",seconds:270, @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');
.app{min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;font-size:14px;max-width:520px;margin:0 auto;transition:background .25s}
.app *{box-sizing:border-box;margin:0;padding:0}
.app button{font-family:inherit;cursor:pointer;background:none;-webkit-appearance:none;appearance:none}
.app .inlbtn,.app .ghost,.app .solid,.app .finishbtn{border-style:solid}
.app .tool,.app .donebtn,.app .timer-act,.app .tab,.app .seg-btn,.app .pill,.app .daybtn,.app .swatch,.app .bs-btn{border-style:solid}
.app .rxfill{border-style:dashed}
.app .step,.app .warm-toggle,.app .wave-col{border:none}
.app input,.app textarea{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;width:100%;min-height:44px;text-align:center;background:var(--inputBg);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:8px;transition:border-color .15s,color .15s}
.app textarea{font-family:'Inter';font-size:13px;font-weight:400;text-align:left;min-height:64px;resize:vertical;line-height:1.5}
.app input:focus,.app textarea:focus{outline:none;border-color:var(--accent)}
.app input::placeholder,.app textarea::placeholder{color:var(--faint)}
.app input.warn{border-color:var(--warn);color:var(--warn)}
.app input.under{border-color:var(--warn);color:var(--warn);background:color-mix(in srgb,var(--warn) 8%,var(--inputBg))}
.app input.over{border-color:var(--ok);color:var(--ok);background:color-mix(in srgb,var(--ok) 8%,var(--inputBg))}
.app button:focus-visible,.app input:focus-visible,.app a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.hdr{padding:calc(18px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-right,0px)) 0 calc(16px + env(safe-area-inset-left,0px));background:var(--bg);border-bottom:1px solid var(--line)}
.hdr-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-family:'Barlow Condensed';font-weight:700;font-size:18px;letter-spacing:.14em}
.brand span{color:var(--accent)}
.status{font-size:11px;color:var(--muted);min-height:14px;text-align:right}
.s-saved{color:var(--ok)}.s-error{color:var(--warn)}
.toolbar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.tool{min-height:54px;border:0.5px solid color-mix(in srgb,var(--accent) 6%,transparent);background:var(--panel);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:color-mix(in srgb,var(--ink) 60%,var(--muted));font-weight:600}
.tool .ic{font-size:16px;color:color-mix(in srgb,var(--accent) 75%,var(--muted));line-height:1}
.tool.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--panel))}
.tool:disabled{opacity:.35}
.wave{display:flex;gap:4px;align-items:flex-end;margin:12px 0 4px;height:58px}
.wave-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;padding:2px 0;min-width:0}
.bar{width:100%;max-width:24px;border-radius:3px 3px 0 0;background:var(--barBg);transition:background .15s}
.bar.deload{background:var(--barDim)}
.bar.test{background:var(--barDim);border:0.5px solid var(--ok)}
.wave-col .bar.deload.test{border-color:var(--ok)}
.wave-col.on .bar{background:var(--accent)}
.wave-col.on .bar.deload{background:var(--slate)}
.wave-col.on .bar.test{background:var(--ok)}

/* The block prescribes top sets and back-offs together ("1\xD75 + 3\xD75 @ +32.5 lb"), and the

.rx>span:first-child{white-space:nowrap}

.exnote{margin-top:8px;font-family:'Inter'!important;font-size:12.5px!important;font-weight:400!important;text-align:left!important;min-height:40px!important;padding:8px 10px!important}

.summary{background:var(--panel);border:1px solid var(--ok);border-radius:10px;padding:12px;font-size:12.5px;line-height:1.6;color:var(--ink);margin-top:10px}

.card.dragging{position:relative;z-index:50;box-shadow:0 10px 28px rgba(0,0,0,.45);cursor:grabbing}

.tag.cut-never{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}

.banner.soft{border-color:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--muted);margin:10px 0 0}
.banner.alertbanner{border-color:var(--warn);border-width:1.5px;color:var(--warn)}
.ridenote{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.55;color:var(--muted);margin-bottom:12px}

.seqlist{margin:10px 0 0;padding-left:18px}

/* set rows: the top set and the week-1 calibration single read differently from back-offs */

/* elastic block */
